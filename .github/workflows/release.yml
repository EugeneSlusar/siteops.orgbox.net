name: release

on:
  push:
    tags: ['v*']
  # Ручной запуск (Actions → release → Run workflow): тег vX.Y.Z создаётся автоматически из выбранной ветки.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zip, curl, mbstring
          coverage: none

      - name: Определить версию и проверить тег
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(php -r '$arModuleVersion=[]; require "modules/orgbox.siteops/install/version.php"; echo $arModuleVersion["VERSION"];')
          if [ "$EVENT" = "push" ] && [ "v$VERSION" != "$REF_NAME" ]; then
            echo "::error::Тег $REF_NAME не совпадает с версией модуля v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Автотесты
        run: php tests/run.php

      - name: Сборка архива
        run: php tools/build-release.php dist

      - name: Подпись архивов
        env:
          SITEOPS_SIGNING_KEY: ${{ secrets.SITEOPS_SIGNING_KEY }}
        run: |
          if [ -n "$SITEOPS_SIGNING_KEY" ]; then
            for archive in "dist/orgbox.siteops-${VERSION}.zip" "dist/site.ops-${VERSION}.zip"; do
              php tools/sign-release.php "$archive"
            done
          else
            echo "::warning::Секрет SITEOPS_SIGNING_KEY не задан: релиз будет без подписи, сайты с настроенным ключом его не установят."
          fi

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Релиз v$VERSION уже существует. Поднимите версию в install/version.php."
            exit 1
          fi
          gh release create "v$VERSION" dist/* --target "$TARGET" --title "v$VERSION" --generate-notes
