name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, curl, mbstring
          coverage: none
      - name: Синтаксис PHP
        run: |
          find modules tests tools -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Автотесты
        run: php tests/run.php
      - name: Сборка архива релиза
        run: php tools/build-release.php dist
